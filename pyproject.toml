[project]
name = "prestameler-v00"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "django>=6.0.6",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
pyz3950 = { git = "https://github.com/asl2/PyZ3950.git" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "prestameler_v00.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
]
